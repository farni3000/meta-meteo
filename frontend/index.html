<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta-Wetter</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px 8px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px 48px;
    }
    .search-wrap {
      position: relative;
      margin: 16px 0;
      max-width: 480px;
    }
    #search {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    #search:focus { outline: none; border-color: var(--accent); }
    #suggestions {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }
    #suggestions.open { display: block; }
    .suggestion {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
    }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover, .suggestion.active { background: var(--panel-2); }
    .suggestion .meta { color: var(--muted); font-size: 0.8rem; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0 4px;
    }
    .toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .toggle button {
      padding: 8px 16px;
      background: var(--panel);
      color: var(--muted);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle button + button { border-left: 1px solid var(--border); }
    .toggle button.active {
      background: var(--accent);
      color: #06202b;
      font-weight: 600;
    }
    #status { color: var(--muted); font-size: 0.9rem; }
    #status.error { color: var(--error); }
    #location-meta { color: var(--muted); font-size: 0.9rem; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 0;
    }
    .chart-card .badges {
      padding: 0 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.72rem;
      color: #06202b;
      background: #fbbf24;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .panel {
      margin-top: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 1rem; }
    .model-row {
      display: flex;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      flex-wrap: wrap;
    }
    .model-row:last-child { border-bottom: none; }
    .model-row .name { min-width: 220px; font-weight: 600; }
    .model-row .models { color: var(--muted); }
    @media (min-width: 900px) {
      .charts { grid-template-columns: 1fr 1fr; }
      .charts .chart-card.wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Meta-Wetter</h1>
    <p>7-Tage-Vorhersage als Mittelwert mehrerer Wettermodelle &ndash; mit Streuung als Fehlerband.</p>
  </header>
  <main>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Ort suchen (z. B. Berlin)" autocomplete="off" />
      <div id="suggestions"></div>
    </div>

    <div class="toolbar">
      <div class="toggle" id="resolution-toggle">
        <button data-mode="hourly" class="active">stündlich</button>
        <button data-mode="daily">täglich</button>
      </div>
      <span id="status"></span>
    </div>
    <div id="location-meta"></div>

    <div class="charts" id="charts"></div>

    <div class="panel" id="models-panel" hidden>
      <h2>Genutzte Modelle je Parameter</h2>
      <div id="models-list"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
