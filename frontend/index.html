<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetaMeteo</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px 8px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand-id {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .lang-select {
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .lang-select:hover, .lang-select:focus { outline: none; border-color: var(--accent); }
    .brand-logo {
      width: 52px;
      height: 52px;
      flex: none;
      filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.45));
    }
    .brand-logo svg { display: block; width: 100%; height: 100%; }
    .brand-text {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(100deg, #7dd3fc, #818cf8 45%, #c084fc 70%, #7dd3fc);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brand-shimmer 8s linear infinite;
    }
    @keyframes brand-shimmer {
      to { background-position: 220% center; }
    }
    .brand-titles p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
    @media (prefers-reduced-motion: reduce) {
      .brand-text { animation: none; }
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px 48px;
    }
    .search-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .search-wrap {
      position: relative;
      flex: 1 1 320px;
      max-width: 480px;
    }
    #search {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    #search:focus { outline: none; border-color: var(--accent); }
    #suggestions {
      position: absolute;
      z-index: 20;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }
    #suggestions.open { display: block; }
    .suggestion {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
    }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover, .suggestion.active { background: var(--panel-2); }
    .suggestion .meta { color: var(--muted); font-size: 0.8rem; }
    .favorites {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      padding-top: 2px;
    }
    .favorites-empty { color: var(--muted); font-size: 0.85rem; }
    .fav-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
    }
    .fav-chip:hover { border-color: var(--accent); }
    .fav-chip.active { border-color: var(--accent); color: var(--accent); }
    .fav-chip.dragging { opacity: 0.4; }
    .fav-chip .label { pointer-events: none; }
    .fav-chip .remove {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
      padding: 0 2px;
    }
    .fav-chip .remove:hover { color: var(--error); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 12px 0 4px;
    }
    .toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .toggle button {
      padding: 8px 16px;
      background: var(--panel);
      color: var(--muted);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .toggle button + button { border-left: 1px solid var(--border); }
    .toggle button.active {
      background: var(--accent);
      color: #06202b;
      font-weight: 600;
    }
    .btn {
      padding: 8px 14px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn[hidden] { display: none; }
    #status { color: var(--muted); font-size: 0.9rem; }
    #status.error { color: var(--error); }
    #location-meta {
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-updated {
      text-decoration: underline dotted;
      text-underline-offset: 2px;
      cursor: help;
    }
    .star-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .star-btn:hover { border-color: var(--accent); color: var(--accent); }
    .star-btn.on { color: #fbbf24; border-color: #fbbf24; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 0;
    }
    .chart-head {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px 0;
    }
    .chart-title { font-size: 0.95rem; font-weight: 600; }
    .info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 11px;
      line-height: 1;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: help;
      flex: none;
    }
    .info:hover { color: var(--accent); border-color: var(--accent); }
    .apply-zoom {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 3px 9px;
      font-size: 0.72rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .apply-zoom:hover { color: var(--accent); border-color: var(--accent); }
    .chart-card .badges {
      padding: 4px 12px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .badge {
      font-size: 0.72rem;
      color: #06202b;
      background: #fbbf24;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .panel {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
    }
    .panel > summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .panel > summary:hover { color: var(--accent); }
    .panel[open] > summary { margin-bottom: 8px; }
    .model-row {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      flex-wrap: wrap;
    }
    .model-row:last-child { border-bottom: none; }
    .model-row .name { min-width: 170px; font-weight: 600; }
    .model-row .models {
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .model-row .missing { color: #fbbf24; }
    .model-row .coverage { color: #94a3b8; font-size: 0.74rem; }
    #models-summary { margin: 0 0 6px; color: var(--muted); font-size: 0.78rem; }
    #models-summary a { color: var(--accent); text-decoration: none; }
    #models-summary a:hover { text-decoration: underline; }
    .docs-note { margin: 0 0 10px; color: var(--muted); font-size: 0.72rem; }
    @media (min-width: 900px) {
      .charts { grid-template-columns: 1fr 1fr; }
      .charts .chart-card.wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-id">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false">
          <defs>
            <linearGradient id="mm-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="55%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#mm-grad)" />
          <g stroke="rgba(15,23,42,0.55)" stroke-width="1.4" stroke-linecap="round">
            <line x1="24" y1="10" x2="24" y2="13" />
            <line x1="24" y1="35" x2="24" y2="38" />
            <line x1="10" y1="24" x2="13" y2="24" />
            <line x1="35" y1="24" x2="38" y2="24" />
          </g>
          <circle cx="24" cy="24" r="12" fill="none" stroke="rgba(15,23,42,0.45)" stroke-width="1.3" />
          <polygon points="24,13 28.5,24 19.5,24" fill="#0f172a" />
          <polygon points="24,35 28.5,24 19.5,24" fill="rgba(15,23,42,0.5)" />
          <circle cx="24" cy="24" r="1.8" fill="#0f172a" />
        </svg>
      </span>
      <div class="brand-titles">
        <h1 class="brand-text">MetaMeteo</h1>
        <p data-i18n="brand.tagline">Viele Meinungen, ein Mittelwert: Wettervorhersage für Datenfreaks.</p>
      </div>
      </div>
      <select id="language-select" class="lang-select" aria-label="Sprache / Language"></select>
    </div>
  </header>
  <main>
    <div class="search-row">
      <div class="search-wrap">
        <input id="search" type="text" data-i18n-placeholder="search.placeholder" placeholder="Ort suchen (z. B. Berlin)" autocomplete="off" />
        <div id="suggestions"></div>
      </div>
      <div id="favorites" class="favorites"></div>
    </div>

    <div class="toolbar">
      <div class="toggle" id="resolution-toggle">
        <button data-mode="hourly" class="active" data-i18n="mode.hourly">stündlich</button>
        <button data-mode="daily" data-i18n="mode.daily">täglich</button>
      </div>
      <span id="window-hint"></span>
      <button id="refresh" class="btn" data-i18n="toolbar.refresh" data-i18n-title="toolbar.refreshTitle" hidden>Aktualisieren</button>
      <button id="reset-zoom" class="btn" data-i18n="toolbar.resetZoom" hidden>Zoom für alle zurücksetzen</button>
      <span id="status"></span>
    </div>
    <div id="location-meta"></div>

    <div class="charts" id="charts"></div>

    <details class="panel" id="models-panel" hidden>
      <summary data-i18n="models.title">Genutzte Modelle je Parameter</summary>
      <p id="models-summary"></p>
      <p class="docs-note" data-i18n="models.docsNote">Links führen zur Open-Meteo-Dokumentation der jeweiligen Modelle.</p>
      <div id="models-list"></div>
    </details>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
